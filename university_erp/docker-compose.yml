# ============================================================
# University ERP — Docker Compose
# ============================================================
# Usage:
#   docker compose up -d          ← start everything
#   docker compose logs -f        ← watch all logs
#   docker compose down -v        ← tear down + delete volumes
# ============================================================

services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: university_erp
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "erp_admin", "-d", "university_erp" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── RabbitMQ ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Rust API Server ──────────────────────────────────────────
  rust_api:
    build:
      context: ./rust_api
      dockerfile: Dockerfile
    container_name: erp_rust_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://erp_admin:erp_secret_2026@postgres:5432/university_erp
      API_PORT: "3000"
      RUST_LOG: university_erp_api=info,tower_http=info
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
    ports:
      - "3000:3000"

  # ── FastAPI Frontend ─────────────────────────────────────────
  web_app:
    build:
      context: ./web_app
      dockerfile: Dockerfile
    container_name: erp_web_app
    restart: unless-stopped
    depends_on:
      - rust_api
    environment:
      RUST_API_URL: http://rust_api:3000
    ports:
      - "8000:8000"
    volumes:
      - ./web_app/static:/app/static
      - ./web_app/templates:/app/templates

  # ── Python ETL Worker ────────────────────────────────────────
  python_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_python_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: university_erp
      DB_USER: erp_admin
      DB_PASSWORD: erp_secret_2026
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      MQ_HOST: rabbitmq
      MQ_PORT: "5672"
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
    command: python main.py
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import pika; pika.BlockingConnection(pika.URLParameters(\"amqp://guest:guest@rabbitmq:5672/%2f\"))' || echo 'not ready'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Test Runner (one-shot) ───────────────────────────────────
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_tests
    profiles: [ "test" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: erp_secret_2026
    command: python -m pytest tests/ -v --tb=short

volumes:
  pgdata:
